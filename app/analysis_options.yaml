include: package:very_good_analysis/analysis_options.yaml

analyzer:
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "lib/l10n/gen/**"
    - "build/**"
    - android/**

linter:
  rules:
    # App code, not a library: no public API docs needed.
    public_member_api_docs: false
    # freezed 4 still generates from `const factory Name(...)`; it rejects the
    # new `factory new(...)` form this lint asks for. Revisit when it can.
    unnecessary_type_name_in_constructor: false
