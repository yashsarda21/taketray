# Runs tool/check, the same script as on the owner's Mac (D-60), including the
# Android unit tests (Robolectric on the JVM, D-67).
# Not run here: Patrol and anything that needs the phone (they stay local, on
# the S24), and tool/check_release_permissions (a full release build, run at
# the end of each phase).
name: check

on:
  push:
  pull_request:
  workflow_dispatch:

# Nothing here writes to the repository, and there are no secrets.
permissions:
  contents: read

# A newer push to the same branch or pull request cancels the older run.
concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  # Runs on main are never cancelled, so every main commit keeps its result.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # GitHub already sets CI=true; stated here because it switches the macOS
  # goldens off and the Linux goldens/ci on (D-61), and the check must not
  # depend on a default.
  CI: "true"
  # Must match EXPECTED_FLUTTER in tool/check, which fails on any other version.
  FLUTTER_VERSION: "3.47.7"

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # tool/flutter and tool/dart run "$HOME/development/flutter/bin/...", so
      # Flutter goes exactly there. The cache holds the clone together with the
      # Dart SDK and engine files that the first run downloads into it.
      - name: Cache Flutter
        id: flutter-cache
        uses: actions/cache@v4
        with:
          path: ~/development/flutter
          key: flutter-${{ runner.os }}-${{ env.FLUTTER_VERSION }}

      - name: Install Flutter ${{ env.FLUTTER_VERSION }}
        if: steps.flutter-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$HOME/development"
          git clone --depth 1 --branch "$FLUTTER_VERSION" \
            https://github.com/flutter/flutter.git "$HOME/development/flutter"

      # Downloads the Dart SDK and the desktop test engine (flutter_tester).
      # tool/check builds no APK; the Android unit tests (tool/test_android)
      # use the runner image's Android SDK, checked below.
      - name: Prepare Flutter
        run: |
          tool/flutter config --disable-analytics
          tool/flutter precache --universal
          tool/flutter --version

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-

      # Stops early, with a clear message, if the runner image ever drops a
      # program that tool/check calls directly.
      - name: Check required programs
        run: |
          for p in git python3 shasum awk find sort; do
            command -v "$p" >/dev/null || { echo "missing on the runner: $p" >&2; exit 1; }
          done

      # Gradle (the Android unit tests, D-67) runs on JDK 17, the version the
      # app's Kotlin and Java targets use.
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Gradle's downloads (the wrapper's Gradle, plugins, libraries) and the
      # Android framework jars Robolectric fetches on first use (one per SDK
      # level in robolectric.properties, about 650 MB together).
      - name: Cache Gradle and Robolectric
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.m2/repository/org/robolectric
          key: gradle-${{ runner.os }}-${{ hashFiles('app/android/**/*.gradle.kts', 'app/android/gradle/wrapper/gradle-wrapper.properties', 'app/android/app/src/test/resources/robolectric.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # The ubuntu image ships the Android SDK and sets ANDROID_HOME; stop
      # early, with a clear message, if that ever changes.
      - name: Check the Android SDK
        run: |
          if [ -z "${ANDROID_HOME:-}" ] || [ ! -d "$ANDROID_HOME/platforms" ]; then
            echo "ANDROID_HOME is not set to an Android SDK on the runner" >&2
            exit 1
          fi
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"
          java -version

      - name: Run tool/check
        run: tool/check

      # A failing golden writes its images to a failures/ folder (D-39).
      - name: Upload golden failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures
          path: |
            **/test/**/failures/**
            **/test/failures/**
          if-no-files-found: ignore
