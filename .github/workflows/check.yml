# Runs tool/check, the same script as on the owner's Mac (D-60), including the
# Android unit tests (Robolectric on the JVM, D-67).
# Not run here: Patrol and anything that needs the phone (they stay local, on
# the S24), and tool/check_release_permissions (a full release build, run at
# the end of each phase).
name: check

on:
  push:
  pull_request:
  workflow_dispatch:

# Nothing here writes to the repository, and there are no secrets.
permissions:
  contents: read

# A newer push to the same branch or pull request cancels the older run.
concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  # Runs on main are never cancelled, so every main commit keeps its result.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # GitHub already sets CI=true; stated here because it switches the macOS
  # goldens off and the Linux goldens/ci on (D-61), and the check must not
  # depend on a default.
  CI: "true"
  # Must match EXPECTED_FLUTTER in tool/check, which fails on any other version.
  FLUTTER_VERSION: "3.47.7"
  # The NDK that Flutter 3.47.7 names (flutter.ndkVersion); checked below.
  ANDROID_NDK_VERSION: "28.2.13676358"

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # tool/flutter and tool/dart run "$HOME/development/flutter/bin/...", so
      # Flutter goes exactly there. The cache holds the clone together with the
      # Dart SDK and engine files that the first run downloads into it.
      - name: Cache Flutter
        id: flutter-cache
        uses: actions/cache@v4
        with:
          path: ~/development/flutter
          key: flutter-${{ runner.os }}-${{ env.FLUTTER_VERSION }}

      - name: Install Flutter ${{ env.FLUTTER_VERSION }}
        if: steps.flutter-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$HOME/development"
          git clone --depth 1 --branch "$FLUTTER_VERSION" \
            https://github.com/flutter/flutter.git "$HOME/development/flutter"

      # Downloads the Dart SDK and the desktop test engine (flutter_tester).
      # tool/check builds no APK; the Android unit tests (tool/test_android)
      # use the runner image's Android SDK, checked below.
      - name: Prepare Flutter
        run: |
          tool/flutter config --disable-analytics
          tool/flutter precache --universal
          tool/flutter --version

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-

      # Stops early, with a clear message, if the runner image ever drops a
      # program that tool/check calls directly.
      - name: Check required programs
        run: |
          for p in git python3 shasum awk find sort; do
            command -v "$p" >/dev/null || { echo "missing on the runner: $p" >&2; exit 1; }
          done

      # Gradle (the Android unit tests, D-67) runs on JDK 17, the version the
      # app's Kotlin and Java targets use.
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Gradle's downloads (the wrapper's Gradle, plugins, libraries) and the
      # Android framework jars Robolectric fetches on first use (one per SDK
      # level in robolectric.properties, about 650 MB together).
      - name: Cache Gradle and Robolectric
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.m2/repository/org/robolectric
          key: gradle-${{ runner.os }}-${{ hashFiles('app/android/**/*.gradle.kts', 'app/android/gradle/wrapper/gradle-wrapper.properties', 'app/android/app/src/test/resources/robolectric.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # The ubuntu image ships the Android SDK in /usr/local/lib/android/sdk
      # and sets ANDROID_HOME to it (the NDK cache below uses that path); stop
      # early, with a clear message, if that ever changes, or if Flutter names
      # another NDK than ANDROID_NDK_VERSION.
      - name: Check the Android SDK
        run: |
          if [ "${ANDROID_HOME:-}" != /usr/local/lib/android/sdk ] || [ ! -d "$ANDROID_HOME/platforms" ]; then
            echo "ANDROID_HOME is not the runner's Android SDK in /usr/local/lib/android/sdk (got '${ANDROID_HOME:-}')" >&2
            exit 1
          fi
          flutter_ndk="$(sed -n 's/.*val ndkVersion: String = "\(.*\)".*/\1/p' \
            "$HOME/development/flutter/packages/flutter_tools/gradle/src/main/kotlin/FlutterExtension.kt")"
          if [ "$flutter_ndk" != "$ANDROID_NDK_VERSION" ]; then
            echo "Flutter names NDK '$flutter_ndk' but ANDROID_NDK_VERSION is '$ANDROID_NDK_VERSION'; update check.yml" >&2
            exit 1
          fi
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"
          ls "$ANDROID_HOME/ndk" || true
          java -version

      # Gradle needs the NDK even to configure the unit tests: a plugin with
      # native code (jni, used by path_provider_android) builds with
      # flutter.ndkVersion. The image does not ship that version, and Gradle's
      # own download of it is slow and failed once (run 40701015612), so it is
      # installed with sdkmanager, retried, and cached.
      - name: Cache the Android NDK
        id: ndk-cache
        uses: actions/cache@v4
        with:
          path: /usr/local/lib/android/sdk/ndk/${{ env.ANDROID_NDK_VERSION }}
          key: ndk-${{ runner.os }}-${{ env.ANDROID_NDK_VERSION }}

      - name: Install the Android NDK
        if: steps.ndk-cache.outputs.cache-hit != 'true'
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          for attempt in 1 2 3; do
            # Licences are already accepted on the image, so there is no prompt.
            if "$sdkmanager" --install "ndk;$ANDROID_NDK_VERSION" </dev/null >/dev/null; then
              break
            fi
            echo "NDK install attempt $attempt failed" >&2
            rm -rf "$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION"
            if [ "$attempt" = 3 ]; then exit 1; fi
          done
          test -f "$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION/source.properties"
          ls "$ANDROID_HOME/ndk"

      - name: Run tool/check
        run: tool/check

      # A failing golden writes its images to a failures/ folder (D-39).
      - name: Upload golden failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures
          path: |
            **/test/**/failures/**
            **/test/failures/**
          if-no-files-found: ignore
